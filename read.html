<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fafaf6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
<title>Reader</title>
<style>
  :root {
    --bg: #fafaf6;
    --text: #1a1a1a;
    --vocab: #7d2e23;
    --muted: #6b6b6b;
    --border: #e0dcd0;
    --link: #1a4d6e;
    --card: rgba(0,0,0,0.03);
    --code-bg: rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --text: #e8e3da;
      --vocab: #e8a584;
      --muted: #9a9a9a;
      --border: #2e2e2e;
      --link: #8fc3df;
      --card: rgba(255,255,255,0.05);
      --code-bg: rgba(255,255,255,0.08);
    }
  }
  * { box-sizing: border-box; }
  html {
    font-size: 22px;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    scroll-behavior: smooth;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.75;
    margin: 0 auto;
    max-width: 36rem;
    padding: 1.5rem 1.1rem 4rem;
    font-weight: 400;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }
  h1 {
    font-size: 1.6rem;
    line-height: 1.25;
    margin: 0 0 1rem;
    letter-spacing: -0.01em;
    font-weight: 700;
  }
  h2 {
    font-size: 1.18rem;
    line-height: 1.3;
    margin: 3rem 0 1.1rem;
    padding-top: 1.3rem;
    border-top: 1px solid var(--border);
    letter-spacing: -0.005em;
    font-weight: 700;
  }
  h3 {
    font-size: 1.02rem;
    margin: 2rem 0 0.6rem;
    font-weight: 700;
  }
  p { margin: 0 0 1.3rem; }
  strong, b {
    color: var(--vocab);
    font-weight: 400;
  }
  em, i { font-style: italic; }
  a { color: var(--link); text-decoration: none; }
  a:hover, a:focus { text-decoration: underline; }
  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 2rem 0;
  }
  blockquote {
    border-left: 3px solid var(--border);
    margin: 1.3rem 0;
    padding: 0.3rem 0 0.3rem 1rem;
    color: var(--muted);
    font-style: italic;
    font-size: 0.95rem;
  }
  blockquote p:last-child { margin-bottom: 0; }
  code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    background: var(--code-bg);
    padding: 0.1rem 0.35rem;
    border-radius: 4px;
    font-size: 0.9em;
  }
  pre {
    background: var(--code-bg);
    padding: 0.8rem 1rem;
    border-radius: 6px;
    overflow-x: auto;
    font-size: 0.9rem;
    line-height: 1.5;
  }
  pre code { background: none; padding: 0; }
  ul, ol {
    padding-left: 1.6rem;
    margin: 0 0 1.3rem;
  }
  li { margin: 0.25rem 0; }
  table {
    border-collapse: collapse;
    width: 100%;
    margin: 1rem 0 2rem;
    font-size: 0.93rem;
    display: block;
    overflow-x: auto;
  }
  th, td {
    text-align: left;
    padding: 0.6rem 0.5rem;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    line-height: 1.5;
  }
  th {
    font-weight: 700;
    color: var(--muted);
    background: var(--card);
  }
  nav.toc {
    background: var(--card);
    padding: 0.9rem 1.2rem;
    border-radius: 8px;
    margin: 1rem 0 2rem;
    font-size: 0.95rem;
  }
  nav.toc .label {
    font-weight: 700;
    display: block;
    margin-bottom: 0.4rem;
  }
  nav.toc ol {
    margin: 0;
    padding-left: 1.3rem;
  }
  nav.toc li {
    margin: 0.25rem 0;
    line-height: 1.5;
  }
  .muted { color: var(--muted); }
  .error {
    background: var(--card);
    padding: 1rem 1.2rem;
    border-radius: 8px;
    border-left: 3px solid var(--vocab);
  }
  @media (max-width: 600px) {
    html { font-size: 21px; }
    body { padding: 1.2rem 0.95rem 3rem; }
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.12rem; margin-top: 2.8rem; }
    th, td { padding: 0.5rem 0.35rem; font-size: 0.95rem; }
    nav.toc { padding: 0.8rem 1rem; }
  }
  @media (min-width: 1100px) {
    html { font-size: 23px; }
  }
</style>
</head>
<body>
<main id="content">
  <p class="muted">Document laden…</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@13.0.2/marked.min.js"></script>
<script>
(async function() {
  const params = new URLSearchParams(location.search);
  const file = params.get('f') || params.get('file');
  const content = document.getElementById('content');

  if (!file) {
    content.innerHTML = '<h1>Reader</h1><p>Geen bestand opgegeven. Gebruik <code>?f=pad/naar/bestand.md</code> in de URL.</p>';
    return;
  }

  if (file.includes('..') || file.startsWith('/') || /^https?:/.test(file)) {
    content.innerHTML = '<h1>Reader</h1><p class="error">Ongeldig pad.</p>';
    return;
  }

  try {
    const response = await fetch(file);
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const md = await response.text();

    content.innerHTML = marked.parse(md);

    content.querySelectorAll('h1, h2, h3').forEach(function(h) {
      if (!h.id) {
        h.id = h.textContent.toLowerCase()
          .replace(/[^\w\s\-]/g, '')
          .replace(/\s+/g, '-')
          .replace(/^-+|-+$/g, '');
      }
    });

    const firstH1 = content.querySelector('h1');
    if (firstH1) document.title = firstH1.textContent;

    const h2s = content.querySelectorAll('h2');
    if (h2s.length >= 3) {
      const toc = document.createElement('nav');
      toc.className = 'toc';
      toc.setAttribute('aria-label', 'Inhoud');
      const items = Array.from(h2s).map(function(h) {
        return '<li><a href="#' + h.id + '">' + h.textContent + '</a></li>';
      }).join('');
      toc.innerHTML = '<span class="label">Inhoud</span><ol>' + items + '</ol>';
      const anchor = firstH1 ? firstH1.nextElementSibling : content.firstChild;
      if (anchor && anchor.parentNode) {
        anchor.parentNode.insertBefore(toc, anchor.nextSibling);
      } else {
        content.insertBefore(toc, content.firstChild);
      }
    }
  } catch (err) {
    content.innerHTML = '<h1>Reader</h1><p class="error">Fout bij laden van <code>' + file + '</code>: ' + err.message + '</p>';
  }
})();
</script>
</body>
</html>
